<!-- Use the identical rich interface as standalone_web/RadarDashboard.html -->
<!-- This file can be served from ESP32 LittleFS/SPIFFS via 'pio run -t uploadfs' -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar Fusion OS // Dual 24GHz + 60GHz</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(18, 25, 43, 0.85);
      --border: #1e2c47;
      --cyan: #00e5ff;
      --magenta: #e040fb;
      --amber: #ffb300;
      --alert: #ff1744;
      --green: #00e676;
      --text: #e2e8f0;
      --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', -apple-system, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: rgba(12, 17, 29, 0.95); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
    .brand-title { font-size: 1.15rem; font-weight: 700; background: linear-gradient(90deg, #00e5ff, #e040fb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .btn { background: #1e293b; border: 1px solid var(--border); color: var(--text); padding: 6px 14px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; }
    .btn:hover { background: #334155; }
    .btn-active { background: rgba(0, 229, 255, 0.2) !important; border-color: var(--cyan) !important; color: #fff !important; }
    #alertBanner { display: none; background: #ff1744; color: #fff; text-align: center; padding: 8px; font-weight: 700; letter-spacing: 2px; }
    .main-container { display: grid; grid-template-columns: 1fr 420px; gap: 16px; padding: 16px; flex: 1; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
    .canvas-wrapper { position: relative; flex: 1; min-height: 460px; background: radial-gradient(circle at 50% 90%, #0d1527 0%, #080c14 80%); border-radius: 10px; border: 1px solid #142036; }
    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .form-group { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.85rem; }
    .form-input { background: #0f172a; border: 1px solid var(--border); color: #fff; padding: 4px 8px; width: 65px; border-radius: 4px; }
    .terminal { background: #080c14; border: 1px solid #142036; padding: 6px; font-family: monospace; font-size: 0.72rem; color: #38bdf8; max-height: 80px; overflow-y: auto; }
    @media (max-width: 900px) { .main-container { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="alertBanner">🚨 GEOFENCE BREACH: INTRUDER DETECTED 🚨</div>
  <header>
    <div>
      <div class="brand-title">RADAR FUSION LABS</div>
      <div style="font-size:0.75rem; color:var(--muted);">24GHz LD2452 + 60GHz LD6003D mmWave System</div>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="btn" id="m0" onclick="setMode(0)">24G (LD2452)</button>
      <button class="btn" id="m1" onclick="setMode(1)">60G (LD6003D)</button>
      <button class="btn btn-active" id="m2" onclick="setMode(2)">DUAL FUSION</button>
    </div>
    <div style="font-size:0.8rem; font-family:monospace; color:var(--green);" id="status">● CONNECTED</div>
  </header>

  <div class="main-container">
    <div class="card" style="display:flex; flex-direction:column;">
      <div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:0.85rem; color:var(--cyan); font-weight:700;">
        <span>SPATIAL RADAR HUD</span>
        <span id="fps">-- FPS</span>
      </div>
      <div class="canvas-wrapper" id="cWrap"><canvas id="rCanvas"></canvas></div>
    </div>

    <div style="display:flex; flex-direction:column; gap:14px;">
      <div class="card">
        <div style="font-size:0.85rem; font-weight:700; color:var(--cyan); margin-bottom:10px;">TARGET TELEMETRY</div>
        <div id="tgtList" style="display:flex; flex-direction:column; gap:6px;">Awaiting Targets...</div>
      </div>

      <div class="card">
        <div style="font-size:0.85rem; font-weight:700; color:var(--cyan); margin-bottom:8px;">GEOFENCE ALERT ZONE</div>
        <div class="form-group"><label>Zone Active:</label><input type="checkbox" id="zEn" checked onchange="saveZone()"></div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
          <div class="form-group"><label>X Min:</label><input type="number" step="0.2" class="form-input" id="zx1" value="-1.5" onchange="saveZone()"></div>
          <div class="form-group"><label>X Max:</label><input type="number" step="0.2" class="form-input" id="zx2" value="1.5" onchange="saveZone()"></div>
          <div class="form-group"><label>Y Min:</label><input type="number" step="0.2" class="form-input" id="zy1" value="1.0" onchange="saveZone()"></div>
          <div class="form-group"><label>Y Max:</label><input type="number" step="0.2" class="form-input" id="zy2" value="3.5" onchange="saveZone()"></div>
        </div>
      </div>

      <div class="card">
        <div style="font-size:0.85rem; font-weight:700; color:var(--cyan); margin-bottom:8px;">CONTROLS & RANGE</div>
        <div class="form-group">
          <label>Range (m):</label>
          <input type="range" min="2" max="8" step="1" id="rng" value="6" oninput="setRange(this.value)">
          <span id="rngVal">6m</span>
        </div>
        <div class="form-group"><label>Cartesian Grid:</label><input type="checkbox" id="grd" checked onchange="toggleGrid()"></div>
      </div>

      <div class="card">
        <div style="font-size:0.85rem; font-weight:700; color:var(--cyan); margin-bottom:4px;">RAW PACKET SNIFFER</div>
        <div style="font-size:0.7rem; color:var(--cyan);">HLK-LD2452 (24G):</div>
        <div class="terminal" id="raw24">--</div>
        <div style="font-size:0.7rem; color:var(--amber); margin-top:4px;">HLK-LD6003D (60G):</div>
        <div class="terminal" id="raw60">--</div>
      </div>
    </div>
  </div>

  <script>
    let ws = null;
    let data = { mode: 2, range: 6, targets: [], zone: { enabled: true, xMin: -1.5, xMax: 1.5, yMin: 1.0, yMax: 3.5 } };
    let sweep = -60;
    let canvas, ctx;

    window.onload = () => {
      canvas = document.getElementById('rCanvas');
      ctx = canvas.getContext('2d');
      resize();
      window.onresize = resize;
      connect();
      requestAnimationFrame(render);
    };

    function resize() {
      let w = document.getElementById('cWrap');
      canvas.width = w.clientWidth;
      canvas.height = w.clientHeight;
    }

    function connect() {
      ws = new WebSocket('ws://' + window.location.host + '/ws');
      ws.onopen = () => { document.getElementById('status').innerText = "● LIVE"; };
      ws.onclose = () => { document.getElementById('status').innerText = "○ RECONNECTING"; setTimeout(connect, 2000); };
      ws.onmessage = (e) => {
        try {
          data = JSON.parse(e.data);
          document.getElementById('fps').innerText = Math.round(data.fps || 0) + " FPS";
          document.getElementById('alertBanner').style.display = data.alert ? 'block' : 'none';
          document.getElementById('rngVal').innerText = (data.range || 6) + "m";
          document.getElementById('rng').value = data.range || 6;
          ['m0','m1','m2'].forEach((id, idx) => document.getElementById(id).className = (data.mode === idx) ? "btn btn-active" : "btn");
          if (data.raw24) document.getElementById('raw24').innerText = data.raw24;
          if (data.raw60) document.getElementById('raw60').innerText = data.raw60;
          updateTgt(data.targets || []);
        } catch(err){}
      };
    }

    function updateTgt(tg) {
      let div = document.getElementById('tgtList');
      if (tg.length === 0) { div.innerHTML = "<div style='color:#64748b; font-size:0.8rem;'>No targets locked</div>"; return; }
      let h = '';
      tg.forEach(t => {
        let col = t.src === 3 ? "#e040fb" : (t.src === 2 ? "#ffb300" : "#00e5ff");
        h += `<div style="background:#0f172a; padding:8px; border-radius:6px; border:1px solid ${t.inZone ? '#ff1744' : '#1e2c47'}; font-family:monospace; font-size:0.78rem;">
          <strong style="color:${col}">T${t.id} [${t.src===3?'DUAL':t.src===2?'60G':'24G'}]</strong>: Dist:${t.dist.toFixed(2)}m Ang:${t.ang.toFixed(1)}° Spd:${t.spd.toFixed(2)}m/s
          <div style="color:#64748b;">X:${t.x.toFixed(2)}m Y:${t.y.toFixed(2)}m | ${t.inZone ? '<span style=\"color:#ff1744\">IN ALERT ZONE</span>' : t.conf + '% Conf'}</div>
        </div>`;
      });
      div.innerHTML = h;
    }

    function send(obj) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }
    function setMode(m) { send({ cmd: "set_mode", val: m }); }
    function setRange(r) { send({ cmd: "set_range", val: parseFloat(r) }); }
    function toggleGrid() { send({ cmd: "toggle_grid" }); }
    function saveZone() {
      send({
        cmd: "set_zone",
        enabled: document.getElementById('zEn').checked,
        xMin: parseFloat(document.getElementById('zx1').value),
        xMax: parseFloat(document.getElementById('zx2').value),
        yMin: parseFloat(document.getElementById('zy1').value),
        yMax: parseFloat(document.getElementById('zy2').value)
      });
    }

    function render() {
      let w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      let ox = w / 2, oy = h - 25;
      let maxPix = Math.min(w * 0.45, h - 40);
      let maxR = data.range || 6;

      // Arc
      ctx.beginPath();
      ctx.arc(ox, oy, maxPix, -Math.PI / 2 - (Math.PI / 3), -Math.PI / 2 + (Math.PI / 3));
      ctx.strokeStyle = "#1e293b"; ctx.stroke();

      for (let r = 2; r <= maxR; r += 2) {
        let pr = (r / maxR) * maxPix;
        ctx.beginPath();
        ctx.arc(ox, oy, pr, -Math.PI / 2 - (Math.PI / 3), -Math.PI / 2 + (Math.PI / 3));
        ctx.strokeStyle = "#16233b"; ctx.stroke();
        ctx.fillStyle = "#64748b"; ctx.font = "10px monospace";
        ctx.fillText(r + "m", ox + 15, oy - pr);
      }

      // Sweep
      sweep += 2; if (sweep > 60) sweep = -60;
      let sRad = sweep * (Math.PI / 180);
      ctx.beginPath(); ctx.moveTo(ox, oy);
      ctx.lineTo(ox + Math.sin(sRad) * maxPix, oy - Math.cos(sRad) * maxPix);
      ctx.strokeStyle = "rgba(0,229,255,0.4)"; ctx.stroke();

      // Zone
      let z = data.zone;
      if (z && z.enabled) {
        let x1 = ox + (z.xMin / maxR) * maxPix;
        let y1 = oy - (z.yMax / maxR) * maxPix;
        let x2 = ox + (z.xMax / maxR) * maxPix;
        let y2 = oy - (z.yMin / maxR) * maxPix;
        ctx.strokeStyle = data.alert ? "#ff1744" : "#00e676";
        ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
      }

      // Targets
      (data.targets || []).forEach(t => {
        let tx = ox + (t.x / maxR) * maxPix;
        let ty = oy - (t.y / maxR) * maxPix;
        ctx.fillStyle = t.inZone ? "#ff1744" : (t.src === 3 ? "#e040fb" : (t.src === 2 ? "#ffb300" : "#00e5ff"));
        ctx.beginPath(); ctx.arc(tx, ty, 6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#fff"; ctx.font = "10px monospace";
        ctx.fillText(`T${t.id}:${t.dist.toFixed(1)}m`, tx + 8, ty);
      });

      requestAnimationFrame(render);
    }
  </script>
</body>
</html>
