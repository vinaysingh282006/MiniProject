; =========================================================================
; PlatformIO Project Configuration for ESP32 Radar Fusion System
; Sensors: HLK-LD2452 (24GHz) & HLK-LD6003D (60GHz)
; Display: 3.5" SPI TFT (ILI9488) with XPT2046 Touch Screen
; Web: ESPAsyncWebServer with Real-time WebSocket Data Streaming
; =========================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Board CPU Frequency (240 MHz for high performance rendering & radar parsing)
board_build.f_cpu = 240000000L
board_build.partitions = default.csv

; Build flags: inject TFT_eSPI configuration directly without manual file editing!
build_flags = 
    -D CORE_DEBUG_LEVEL=0
    -D USER_SETUP_LOADED=1
    -D ILI9488_DRIVER=1
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_BL=27
    -D TOUCH_CS=21
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=16000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

; Dependencies:
lib_deps = 
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    bblanchon/ArduinoJson @ ^6.21.4
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
